<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#152d28">
    <title>Scanimals</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1" aria-label="Scanimals garden"></canvas>
      <section id="unity-loading" role="status" aria-live="polite">
        <div class="loading-card">
          <p class="brand">SCANIMALS</p>
          <h1 id="unity-status">Growing your garden…</h1>
          <progress id="unity-progress" max="1" value="0" aria-label="Loading game"></progress>
          <p id="unity-detail"></p>
          <button id="unity-retry" type="button" hidden>Try again</button>
        </div>
      </section>
    </main>
    <div id="unity-tools">
    </div>
    <noscript>Enable JavaScript to open your garden.</noscript>
    <script>
      const canvas = document.getElementById("unity-canvas");
      const loading = document.getElementById("unity-loading");
      const progress = document.getElementById("unity-progress");
      const status = document.getElementById("unity-status");
      const detail = document.getElementById("unity-detail");
      const retry = document.getElementById("unity-retry");
      retry.addEventListener("click", () => window.location.reload());

      function showError(message) {
        loading.hidden = false;
        status.textContent = "The garden could not load.";
        detail.textContent = String(message);
        progress.hidden = true;
        retry.hidden = false;
      }

      // Registration is optional: a browser/cache failure must not prevent the game from loading.
      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js", { scope: "./", updateViaCache: "none" })
            .catch(error => console.warn("Offline cache is unavailable.", error));
        });
      }

      const config = {
        arguments: [],
        dataUrl: "Build/Build.data",
        frameworkUrl: "Build/Build.framework.js",
        codeUrl: "Build/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-container",
        companyName: "Scanimals",
        productName: "Scanimals",
        productVersion: "0.1.0",
        showBanner: (message, type) => {
          if (type === "error") showError(message);
          else console.warn(message);
        }
      };

      const loader = document.createElement("script");
      loader.src = "Build/Build.loader.js";
      loader.onerror = () => showError("Check your connection, then try again.");
      loader.onload = () => {
        createUnityInstance(canvas, config, value => { progress.value = value; })
          .then(instance => {
            loading.hidden = true;
          })
          .catch(showError);
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
